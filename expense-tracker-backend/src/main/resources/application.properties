spring.application.name=expense-tracker-backend

# ===== Server =====
# Render set PORT env; local mặc định 8080
server.port=${PORT:8080}
# Toàn bộ API nằm dưới prefix /api (giống NestJS: app.setGlobalPrefix('api'))
server.servlet.context-path=/api

# ===== Database (PostgreSQL) =====
# Local dev: dùng postgres chạy trong Docker (docker-compose hoặc container expense-tracker-db)
# Deploy Render: DATABASE_URL = connection string Neon
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/expense_tracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# Render free tier yêu cầu SSL cho Postgres bên ngoài; Neon cần sslmode=require
spring.datasource.hikari.connection-init-sql=SELECT 1

# ===== JPA =====
# Tự tạo bảng khi dev (giống TypeORM synchronize); production bật migration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===== JWT =====
# Secret ký token — tối thiểu 32 ký tự (256 bit) vì jjwt HS256 yêu cầu. Đổi thành chuỗi dài bất kỳ, KHÔNG commit lên GitHub.
app.jwt.secret=${JWT_SECRET:change-me-this-is-a-dev-secret-32chars-min}
app.jwt.expiration-ms=86400000

# ===== CORS =====
# Domain frontend được phép gọi API. Nhiều domain phân cách bằng dấu phẩy.
app.cors.origins=${CORS_ORIGIN:http://localhost:5173}

logging.level.org.hibernate.SQL=info
